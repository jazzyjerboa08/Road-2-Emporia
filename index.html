.paletteBtn{

#mapContainer{

    display:flex;
    justify-content:center;

}

svg{

}

.region{
    fill:#999;
    stroke:#222;
    stroke-width:1;

}

.region:hover{

}

#projection{
    margin-top:20px;
    padding:12px;
    background:#111827;
    border-radius:6px;
    font-weight:600;
}
</style>
</head>
<body>

<div id="sidebar">
<h1>Road 2 Emporia</h1>

<div class="sectionTitle">Election</div>
<button onclick="loadElection('aug2025')">August 2025</button>
<button onclick="loadElection('sep2025')">September 2025</button>
<button onclick="loadElection('oct2025')">October 2025</button>
<button onclick="loadElection('nov2025')">November 2025</button>
<button onclick="loadElection('dec2025')">December 2025</button>
<button onclick="loadElection('jan2026')">January 2026</button>

<div class="sectionTitle">Palette</div>
<div id="palette"></div>

<div class="sectionTitle">Nominees</div>
<div id="nomineeInputs"></div>

<div id="projection"></div>
</div>

<div id="mapContainer">
<!-- YOUR SVG MAP GOES HERE -->
<!-- Keep your exact SVG paths with correct IDs -->
</div>

<script>

/* ---------------- SHADE GENERATOR ---------------- */

function generateShades(base){
    const c = hexToRgb(base);
    return {
        safe: base,
        likely: rgbToHex(lighten(c,30)),
        tilt: rgbToHex(lighten(c,60))
    }
}

function lighten(color,percent){
    return {
        r: Math.min(255, color.r + (255-color.r)*percent/100),
        g: Math.min(255, color.g + (255-color.g)*percent/100),
        b: Math.min(255, color.b + (255-color.b)*percent/100)
    }
}

function hexToRgb(hex){
    const bigint=parseInt(hex.slice(1),16);
    return {r:(bigint>>16)&255,g:(bigint>>8)&255,b:bigint&255};
}

function rgbToHex({r,g,b}){
    return "#"+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
}

/* ---------------- ELECTION DATA ---------------- */

const elections={

/* KEEP YOUR OLD ELECTIONS HERE — unchanged for brevity */

 parties:{

  AUP:{name:"Adizzian Unity Party",base:"#9333ea"},

  MoA:{name:"Moderates of Adizzia",base:"#86efac"},
  IND:{name:"Independent",base:"#facc15"}
 },
 nominees:{
  ULS:"Jazzy",
  AUP:"Riri",
  CDP:"Chester",
  MoA:"",
  IND:"Kospii"
 },

  Wicsovia:["ULS","safe"],

  NewValencia:["ULS","safe"],
  Odasa:["CDP","safe"],

},

  IND:{name:"Independent",base:"#facc15"}
 },

  ULS:"Jazzy",
  AUDP:"",
  AFtS:"",
  MoA:"Blade",
  IND:""
 },
 results:{
  Wicsovia:["ULS","safe"],
  Alternat:["MoA","tilt"],
  NewValencia:["ULS","safe"],
  Odasa:["MoA","safe"],
  Mapsin:["MoA","likely"],
  Alexandria:["ULS","safe"],
  Phosias:["MoA","safe"],
  Wakefield:["ULS","tilt"],
  NewBelgium:["MoA","safe"],
  Emporia:["MoA","tilt"],
  IslandTerritories:["ULS","likely"]
 }
},

/* ---------------- FEBRUARY 2026 (DEFAULT) ---------------- */
feb2026:{
 parties:{
  ULS:{name:"United Liberal Socialists",base:"#2563eb"},
  DMoA:{name:"Democratic Moderates of Adizzia",base:"#f97316"},
  AFtS:{name:"AFtS",base:"#7c2d12"},
  UAP:{name:"United Adizzia Party",base:"#e5e7eb"},
  IND:{name:"Independent",base:"#facc15"}
 },
 nominees:{
  ULS:"Jazzy",
  DMoA:"",
  AFtS:"",
  UAP:"",
  IND:""
 },
 results:{
  Wicsovia:["ULS","tilt"],
  Alternat:["UAP","safe"],
  NewValencia:["ULS","safe"],
  Odasa:["ULS","likely"],
  Mapsin:["ULS","tilt"],
  Alexandria:["ULS","safe"],
  Phosias:["AFtS","safe"],
  Wakefield:["AFtS","tilt"],

  Emporia:["UAP","tilt"],
  IslandTerritories:["ULS","safe"]
 }
}

};

/* ---------------- CORE LOGIC ---------------- */

let currentElection=null;

function loadElection(key){
    currentElection=elections[key];
    buildPalette();
    buildNominees();
    applyResults();
}

function buildPalette(){
    const div=document.getElementById("palette");
    div.innerHTML="";
    Object.entries(currentElection.parties).forEach(([code,party])=>{
        const shades=generateShades(party.base);
        ["safe","likely","tilt"].forEach(level=>{
            const btn=document.createElement("div");
            btn.className="paletteBtn";
            btn.style.background=shades[level];
            btn.innerText=`${code} - ${level.toUpperCase()}`;
            btn.onclick=()=>selected={code,level};
            div.appendChild(btn);
        });
    });
}

function buildNominees(){
    const div=document.getElementById("nomineeInputs");
    div.innerHTML="";
    Object.entries(currentElection.parties).forEach(([code,party])=>{
        const input=document.createElement("input");
        input.placeholder=`${code} Nominee`;
        input.value=currentElection.nominees[code]||"";
        input.oninput=(e)=>currentElection.nominees[code]=e.target.value;
        div.appendChild(input);
    });
}

function applyResults(){
    const regions=document.querySelectorAll(".region");
    regions.forEach(r=>r.style.fill="#999");

    const totals={};

    Object.entries(currentElection.results).forEach(([region,[party,level]])=>{
        const el=document.getElementById(region);
        if(!el) return;
        const base=currentElection.parties[party].base;
        const shade=generateShades(base)[level];
        el.style.fill=shade;

        if(!totals[party]) totals[party]=0;
        totals[party]+= level==="safe"?3:level==="likely"?2:1;
    });

    const winner=Object.entries(totals).sort((a,b)=>b[1]-a[1])[0][0];
    const partyName=currentElection.parties[winner].name;

    const text = partyName==="AFtS"
        ? `${partyName} will win`
        : `The ${partyName} are projected to win`;

    document.getElementById("projection").innerText=text;
}

/* AUTOLOAD FEBRUARY */
window.onload=()=>loadElection("feb2026");

</script>
</body>
</html>
